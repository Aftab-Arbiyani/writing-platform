# ─────────────────────────────────────────────────────────────────────────────
# SPA serving config — used as /etc/nginx/conf.d/default.conf inside the
# frontend and admin runtime images (see infrastructure/docker/*.Dockerfile).
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ────────────────────────────────────────────────────
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ── Compression ─────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;

    # ── Hashed build assets: cache forever ──────────────────────────────────
    # Vite emits content-hashed filenames under /assets/, so they are immutable.
    # NOTE: add_header in a location block replaces inherited headers, so the
    # security headers are repeated here deliberately.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    # ── SPA fallback ────────────────────────────────────────────────────────
    # Unknown paths are client-side routes — serve the app shell.
    location / {
        try_files $uri /index.html;
    }
}
