# ─────────────────────────────────────────────────────────────────────────────
# SPA serving config — used as /etc/nginx/conf.d/default.conf inside the
# frontend and admin runtime images (see infrastructure/docker/*.Dockerfile).
#
# Runs under the unprivileged `nginx` user on port 8080 (the images drop root;
# the pid file + cache dirs are rewired in the Dockerfile). Only writable temp
# paths need declaring here — point the request-body buffer at /tmp so nothing
# under the (root-owned) default cache tree is required at runtime.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Non-root-friendly temp path (nginx creates it on start under sticky /tmp).
    client_body_temp_path /tmp/nginx-client-body;

    # ── Security headers ────────────────────────────────────────────────────
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ── Compression ─────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;

    # ── Container healthcheck ────────────────────────────────────────────────
    # Cheap liveness endpoint hit by the Dockerfile HEALTHCHECK; kept out of the
    # access log so it never drowns real traffic.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # ── Hashed build assets: cache forever ──────────────────────────────────
    # Vite emits content-hashed filenames under /assets/, so they are immutable.
    # NOTE: add_header in a location block replaces inherited headers, so the
    # security headers are repeated here deliberately.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    # ── SPA fallback ────────────────────────────────────────────────────────
    # Unknown paths are client-side routes — serve the app shell.
    location / {
        try_files $uri /index.html;
    }
}
