name: E2E

# Integration / e2e suite against real Postgres + Redis + MinIO. Manual for now
# (docs 18: e2e becomes a blocking PR gate once Testcontainers lands in Phase 1.5;
# until then it is runnable on demand and on merges to main).
on:
  workflow_dispatch:
  push:
    # `develop` carries this repo's work (`main` holds only the README), so a main-only
    # trigger meant this workflow never fired — same defect as web-e2e.yml. Note
    # `workflow_dispatch` cannot substitute: GitHub only surfaces the dispatch button for
    # workflows present on the default branch, and main carries no workflow files.
    branches: [main, develop]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    # The suite itself takes ~35s; the rest is install + build. This ceiling exists because
    # the job has no other defence against a HANG: without it a stuck run inherits GitHub's
    # 6-hour default, which is exactly what happened on 2026-09-08 (50+ minutes on a step
    # whose tests had already finished). Fail in twenty minutes and say so.
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: umberleaf
          POSTGRES_PASSWORD: umberleaf
          POSTGRES_DB: umberleaf
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U umberleaf"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://umberleaf:umberleaf@localhost:5432/umberleaf
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-not-a-real-secret-000000
      JWT_REFRESH_SECRET: ci-refresh-secret-not-a-real-secret-00000
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: umberleaf-media
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      SMTP_URL: smtp://localhost:1025
      # Scheduler off in tests — cron would fire mid-suite; workers stay on so
      # queue-backed flows still process.
      SCHEDULER_ENABLED: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9.12.0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      # MinIO needs a `server` command, which GH service containers can't set —
      # run it as a background container and create the media bucket.
      - name: Start MinIO + create bucket
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/ready && break || sleep 2
          done
          aws --endpoint-url http://localhost:9000 s3 mb s3://umberleaf-media || true
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          AWS_DEFAULT_REGION: us-east-1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `@umberleaf/shared` and `@umberleaf/api-types` are consumed through their built `dist/`,
      # so the backend cannot even be TYPE-CHECKED until they exist — and `migration:run`
      # goes through ts-node, which type-checks. Without this the very next step dies with
      # `TS2307: Cannot find module '@umberleaf/shared'` before a single migration is applied.
      - name: Build workspace packages
        run: pnpm --filter "@umberleaf/*" build

      - name: Run migrations
        run: pnpm --filter backend migration:run

      # **The suite cannot pass without this, and it was never here.** The e2e specs assume a
      # seeded instance — roles and permissions above all, since almost every spec authenticates
      # and then hits a guarded route. Measured against a fresh database on 2026-09-08:
      # unseeded 99 failed / 52 passed, seeded 148 passed / 3 failed. `web-e2e.yml` has always
      # seeded (`migrate, seed, start`); this workflow simply never did, and the failure it
      # caused was invisible because the job died at the migration step first.
      - name: Seed the instance
        run: pnpm --filter backend seed

      # `test:e2e` carries `--forceExit`, and that is a MITIGATION rather than a fix — worth
      # knowing before anyone removes it. Every spec closes its app in `afterAll`, the tests all
      # complete in ~35s, and then Jest cannot exit: something in a library (an ioredis or pg
      # socket, most likely) outlives `app.close()`. `--detectOpenHandles` ran the full suite and
      # named NOTHING, so the handle is not tracked by async_hooks and there is no obvious thread
      # to pull. Until someone finds it, `--forceExit` turns a six-hour stall into a verdict.
      - name: E2E tests
        run: pnpm --filter backend test:e2e
