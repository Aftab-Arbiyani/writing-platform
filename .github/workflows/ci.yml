name: CI

on:
  pull_request:
  push:
    branches: [main]

# One run per ref — a new push cancels the previous run for that branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default for every job. Jobs that need more (none here — CI
# neither pushes images nor writes releases) elevate at the job level.
permissions:
  contents: read

# NOTE (docs 13/15 §4): third-party actions SHOULD be SHA-pinned in production.
# The pre-existing actions below use version TAGS for readability (tracked TODO;
# pin to commit SHAs before GA). Actions ADDED for P7.1 (Trivy, Syft/SBOM,
# cosign) are already SHA-pinned with a # vX.Y.Z comment, per the CD hardening
# standard — new supply-chain-sensitive actions must be immutable.

jobs:
  # Lint + typecheck + unit tests + build (the fast gate on every PR).
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Turborepo local cache — keyed by sha, restored from the most recent
      # run on any branch so unchanged tasks are replayed, not re-executed.
      - name: Restore turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Prettier formatting gate — fails the build on unformatted files so the
      # tree stays consistent (mirrors the local pre-commit hook).
      - name: Format check
        run: pnpm format:check

      - name: Lint, typecheck, test, build
        run: pnpm turbo lint typecheck test build

  # Dependency + secret hygiene (docs 15 §4).
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Fails the build on any HIGH/CRITICAL advisory in production deps.
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level high
      # Secret scan — blocks committed credentials/tokens.
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # License audit (P7.2 supply chain) — inventory of production dependency
      # licenses. Reported (non-blocking); a copyleft/unknown license surfaces
      # here for the third-party-package review before it can ship.
      - name: License audit (production deps)
        run: pnpm licenses list --prod || true

  # Migration up/down validation against a real Postgres (docs 15 §5).
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: qalam
          POSTGRES_PASSWORD: qalam
          POSTGRES_DB: qalam
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U qalam"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://qalam:qalam@localhost:5432/qalam
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Apply all migrations, revert the latest (proves down()), re-apply — so a
      # migration without a working rollback fails CI.
      - name: Validate migrations (up → down → up)
        run: |
          pnpm --filter backend migration:run
          pnpm --filter backend migration:revert
          pnpm --filter backend migration:run

  # Prove the production image builds (build-once-promote-many; docs 15 §2).
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/backend.Dockerfile
          push: false
          tags: qalam-backend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Container image supply-chain scan (docs 15 §4). Builds the backend image,
  # fails on fixable HIGH/CRITICAL OS+library CVEs, publishes an SBOM artifact,
  # and carries a gated cosign signing seam (inert until keys exist; real
  # signing runs in release.yml against the pushed digest).
  image-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Gate the cosign seam on secret presence so it is a no-op on forks/PRs
      # and until an org signing key is provisioned.
      HAS_COSIGN: ${{ secrets.COSIGN_KEY != '' }}
      IMAGE_REF: qalam-backend:scan-${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      # Load into the local daemon (push:false) so Trivy and Syft can scan it.
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/backend.Dockerfile
          load: true
          push: false
          tags: ${{ env.IMAGE_REF }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Fail the build on fixable HIGH/CRITICAL CVEs. ignore-unfixed avoids
      # blocking on advisories with no upstream patch (noise, not actionable).
      - name: Trivy image vulnerability scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          scan-type: image
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
      # SPDX SBOM of the built image, uploaded as a workflow artifact for audit.
      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE_REF }}
          format: spdx-json
          artifact-name: sbom-backend.spdx.json
          output-file: sbom-backend.spdx.json
      # ── Cosign signing SEAM ────────────────────────────────────────────────
      # Inert until an org COSIGN_KEY secret exists. CI builds but does not push,
      # so there is no digest to sign here — this documents the wiring and proves
      # the gate. Production signing happens in release.yml on the pushed digest.
      - name: Install cosign (signing seam)
        if: env.HAS_COSIGN == 'true'
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: Cosign seam note
        if: env.HAS_COSIGN == 'true'
        run: echo "COSIGN_KEY present — image signing is wired in release.yml against the pushed digest."
