name: CI

on:
  pull_request:
  push:
    branches: [main]

# One run per ref — a new push cancels the previous run for that branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# NOTE (docs 13/15 §4): third-party actions SHOULD be SHA-pinned in production.
# Version tags are used here for readability; pin to commit SHAs before GA.

jobs:
  # Lint + typecheck + unit tests + build (the fast gate on every PR).
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Turborepo local cache — keyed by sha, restored from the most recent
      # run on any branch so unchanged tasks are replayed, not re-executed.
      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, typecheck, test, build
        run: pnpm turbo lint typecheck test build

  # Dependency + secret hygiene (docs 15 §4).
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Fails the build on any HIGH/CRITICAL advisory in production deps.
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level high
      # Secret scan — blocks committed credentials/tokens.
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Migration up/down validation against a real Postgres (docs 15 §5).
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: qalam
          POSTGRES_PASSWORD: qalam
          POSTGRES_DB: qalam
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U qalam"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://qalam:qalam@localhost:5432/qalam
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Apply all migrations, revert the latest (proves down()), re-apply — so a
      # migration without a working rollback fails CI.
      - name: Validate migrations (up → down → up)
        run: |
          pnpm --filter backend migration:run
          pnpm --filter backend migration:revert
          pnpm --filter backend migration:run

  # Prove the production image builds (build-once-promote-many; docs 15 §2).
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/backend.Dockerfile
          push: false
          tags: qalam-backend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
