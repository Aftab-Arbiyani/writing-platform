name: Web E2E

# Browser end-to-end suite (Playwright) for the frontend + admin apps against a
# real backend + Postgres/Redis/MinIO/Mailpit. Mirrors e2e.yml's infra wiring.
# Non-blocking for now (workflow_dispatch + merge to main); becomes a required PR
# gate at Phase 2 exit (docs/e2e/07 §6).
#
# Two jobs (docs/e2e/06 §7, 10 §5):
#   • web-e2e         — functional (P1–P4) + @a11y + @responsive, per engine, sharded.
#   • web-e2e-visual  — @phase5 @visual only, executed INSIDE the pinned Playwright
#                       Docker image so screenshot rendering is reproducible and matches
#                       the committed baselines ([10 §2.2, §5]). The runner OS is pinned
#                       to ubuntu-24.04 (same noble base as the image) for the rest.
on:
  workflow_dispatch:
    inputs:
      update_visual_baselines:
        description: 'Regenerate visual baselines (--update-snapshots) and upload them as an artifact to commit'
        type: boolean
        default: false
  push:
    # `develop` is where this repo's work actually lands (`main` currently holds only the
    # README), so a main-only trigger meant this workflow could never fire — the phase exit
    # criterion "3 green CI runs" was unreachable. Note `workflow_dispatch` is also invisible
    # in the UI until this file exists on the default branch; `push` uses the pushed commit's
    # copy, so the develop trigger works today. Remove `develop` if/when the repo returns to
    # the trunk-based model documented in docs/17.
    branches: [main, develop]

concurrency:
  group: web-e2e-${{ github.ref }}
  cancel-in-progress: true

# Pinned Playwright Docker image — MUST match the e2e package's @playwright/test version so
# the browser builds (and thus visual rendering) are identical to what produced the baselines.
env:
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.61.1-noble

jobs:
  web-e2e:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: qalam
          POSTGRES_PASSWORD: qalam
          POSTGRES_DB: qalam
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U qalam"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://qalam:qalam@localhost:5432/qalam
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-not-a-real-secret-000000
      JWT_REFRESH_SECRET: ci-refresh-secret-not-a-real-secret-00000
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: qalam-media
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      SMTP_URL: smtp://localhost:1025
      APP_URL: http://localhost:5173
      ADMIN_URL: http://localhost:5174
      # Scheduler off (cron would fire mid-suite); workers stay on.
      SCHEDULER_ENABLED: 'false'
      # Rate limiter off — the suite registers many throwaway users + logs in fresh per test
      # from one IP (docs/e2e/03 fresh-login), which the auth throttle would 429.
      RATE_LIMIT_ENABLED: 'false'
      # The `manual` payment provider — lets the af5 row assert subscribe → payment → entitlement
      # without a processor credential (48 §3.6 W4-4). Never enabled outside a test stack.
      PAYMENTS_MANUAL_ENABLED: 'true'
      # The `stub` AI provider — the same move for AI: it streams a fixed passage so the af2 row can
      # assert a generated suggestion without a vendor key (docs/e2e/06 §6). Both vars are needed and
      # they are BACKEND vars, deliberately not in the Vite build step above: the client has no AI
      # switch to set, and `AI_DEFAULT_PROVIDER` is what makes the orchestrator resolve `stub` (its
      # default is `openai`, whose adapter would refuse for want of a key). Never outside a test stack
      # — with these on, every writer's suggestion is the same canned paragraph.
      AI_STUB_ENABLED: 'true'
      AI_DEFAULT_PROVIDER: stub
      CI: 'true'
      E2E_API_URL: http://localhost:4000/api/v1
      E2E_MAILPIT_URL: http://localhost:8025
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Start MinIO + create bucket
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/ready && break || sleep 2
          done
          aws --endpoint-url http://localhost:9000 s3 mb s3://qalam-media || true
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          AWS_DEFAULT_REGION: us-east-1

      - name: Start Mailpit
        run: docker run -d --name mailpit -p 1025:1025 -p 8025:8025 axllent/mailpit

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The two dark-launch flags MUST be set here, not on the preview server. Vite inlines
      # `import.meta.env` at BUILD time (`frontend/src/config/env.ts` parses it), so the
      # `webServer.env` block in `e2e/playwright.config.ts` only takes effect locally, where the
      # command is `dev` and env is read per request. In CI the command is `preview`, which serves
      # an already-built bundle — and the visual job reuses servers this workflow starts, so
      # `webServer` never runs at all. Without these, `VITE_ENABLE_*` fall back to their `'false'`
      # defaults and every collaboration/monetization spec silently tests the flag-off surface:
      # the routes are unregistered, `settings-layout` drops its Safety and Billing sections, and
      # the @visual specs fail before `toHaveScreenshot` so their baselines can never be minted.
      #
      # `VITE_API_URL` is REQUIRED and has no default in `frontend/src/config/env.ts`, and
      # `frontend/.env` is gitignored — so it does not exist on a runner. Without this line the
      # frontend bundle throws at MODULE LOAD ("Invalid environment configuration: VITE_API_URL:
      # Required"), `#root` never mounts, and the app serves a blank page that still answers 200
      # — so `wait-health.sh` passes and the failure only surfaces as `setup-frontend` timing out
      # on `getByLabel('Email')`, taking all 48 frontend specs with it as skips.
      #
      # Admin does NOT need it here only because `admin/src/config/env.ts` defaults the same
      # value. Set it explicitly for both anyway: the default silently masking a missing var is
      # what made this a one-app outage instead of an obvious two-app one.
      - name: Build shared packages + both apps
        env:
          VITE_API_URL: http://localhost:4000/api/v1
          VITE_ENABLE_COLLABORATION: 'true'
          VITE_ENABLE_MONETIZATION: 'true'
        run: |
          pnpm --filter "@qalam/*" build
          pnpm --filter frontend build
          pnpm --filter admin build

      # Migrate + seed BEFORE booting the app. SettingsService.onModuleInit calls
      # syncDefinitions() (settings + feature-flag definitions) against the DB at
      # bootstrap, so an unmigrated schema kills the process on start and the health
      # wait then burns its full timeout before failing the job.
      - name: Build backend, migrate, seed, start
        run: |
          pnpm --filter backend build
          pnpm --filter backend migration:run
          pnpm --filter backend seed
          pnpm --filter backend seed:e2e
          node backend/dist/main.js &
          e2e/scripts/wait-health.sh http://localhost:4000/health 120

      # `chromium` is installed ALONGSIDE the matrix browser, always. Both setup projects
      # (`setup-frontend`, `setup-admin`) are pinned to `devices['Desktop Chrome']` because auth
      # state is engine-agnostic — so every leg needs chromium to mint storageState, even the
      # firefox and webkit ones. Installing only `${{ matrix.browser }}` meant those two legs died
      # in `Before Hooks` with "browserType.launch: Executable doesn't exist …
      # chromium_headless_shell", which fails the setup project and SKIPS every project that
      # depends on it — so the firefox and webkit legs reported failure without running a single
      # real test. On the chromium leg the extra argument is a harmless no-op.
      - name: Install Playwright browser (${{ matrix.browser }})
        run: pnpm --filter e2e exec playwright install --with-deps ${{ matrix.browser }} chromium

      # Functional (P1–P4) + @a11y on all engines; @responsive (chromium-only viewport
      # projects) on the chromium leg. @visual is EXCLUDED here — it runs in the pinned
      # container job below so rendering matches the committed baselines.
      - name: Run E2E (${{ matrix.browser }} shard ${{ matrix.shard }})
        run: |
          PROJECTS="--project=frontend-${{ matrix.browser }} --project=admin-${{ matrix.browser }}"
          if [ "${{ matrix.browser }}" = "chromium" ]; then
            PROJECTS="$PROJECTS --project=frontend-mobile --project=frontend-tablet --project=admin-mobile --project=admin-tablet"
            # The dark projects are Desktop Chrome + colorScheme:'dark' and match UI_QUALITY_ONLY
            # (a11y|visual), so on this leg — with `--grep-invert @visual` below — they contribute
            # the dark-mode @a11y run. Their @visual half runs in the pinned-image job. Before this,
            # NO job selected either dark project: the sharded job listed only the engine + viewport
            # projects and the visual job hardcoded the six desktop ones, so both dark projects and
            # their committed baselines were dead config (docs/e2e/10 §3.3).
            PROJECTS="$PROJECTS --project=frontend-dark --project=admin-dark"
          fi
          pnpm --filter e2e exec playwright test $PROJECTS --grep-invert @visual --shard=${{ matrix.shard }}/2

      - name: Upload report + traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}-shard${{ matrix.shard }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14

  # Visual regression — runs the @visual specs INSIDE the pinned Playwright image so the
  # screenshots render byte-for-byte like the committed baselines (docs/e2e/10 §2.2, §5).
  # Infra + apps + backend are brought up on the runner (host); the app preview servers run
  # on the host and the container attaches via `--network host` (E2E_REUSE_SERVER=1) — exactly
  # the flow used to author the baselines locally.
  web-e2e-visual:
    runs-on: ubuntu-24.04
    # ADVISORY, not blocking — deliberately, and not because pixel tests are unimportant.
    #
    # As of run #26 the six FUNCTIONAL jobs are green on all three engines (#24 and #26), and that
    # is the gate which has caught every real defect this month. This job is the most brittle thing
    # in the suite — 124 baselines across 8 projects, sensitive to fonts, timing, animation and row
    # counts — and its remaining failures are three separate problems, one of which cannot be fixed
    # without a product decision (`AI-panel-visual`, 48 §3.25a/§3.25f). Holding regression
    # protection on every PR behind that buys nothing.
    #
    # Advisory means it still RUNS, still uploads diffs, and is still reviewed — the same posture
    # `KNOWN_A11Y_FINDINGS` takes for a11y debt: downgrade visibly rather than skip silently. Remove
    # this line once §3.25f's four steps are done; it is not meant to be permanent, and leaving it
    # after the suite is deterministic would quietly delete the coverage.
    continue-on-error: true
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: qalam
          POSTGRES_PASSWORD: qalam
          POSTGRES_DB: qalam
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U qalam"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://qalam:qalam@localhost:5432/qalam
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-not-a-real-secret-000000
      JWT_REFRESH_SECRET: ci-refresh-secret-not-a-real-secret-00000
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: qalam-media
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      SMTP_URL: smtp://localhost:1025
      APP_URL: http://localhost:5173
      ADMIN_URL: http://localhost:5174
      SCHEDULER_ENABLED: 'false'
      RATE_LIMIT_ENABLED: 'false'
      # The `manual` payment provider — lets the af5 row assert subscribe → payment → entitlement
      # without a processor credential (48 §3.6 W4-4). Never enabled outside a test stack.
      PAYMENTS_MANUAL_ENABLED: 'true'
      # The `stub` AI provider — the same move for AI: it streams a fixed passage so the af2 row can
      # assert a generated suggestion without a vendor key (docs/e2e/06 §6). Both vars are needed and
      # they are BACKEND vars, deliberately not in the Vite build step above: the client has no AI
      # switch to set, and `AI_DEFAULT_PROVIDER` is what makes the orchestrator resolve `stub` (its
      # default is `openai`, whose adapter would refuse for want of a key). Never outside a test stack
      # — with these on, every writer's suggestion is the same canned paragraph.
      AI_STUB_ENABLED: 'true'
      AI_DEFAULT_PROVIDER: stub
      CI: 'true'
      E2E_API_URL: http://localhost:4000/api/v1
      E2E_MAILPIT_URL: http://localhost:8025
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Start MinIO + create bucket
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/ready && break || sleep 2
          done
          aws --endpoint-url http://localhost:9000 s3 mb s3://qalam-media || true
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          AWS_DEFAULT_REGION: us-east-1

      - name: Start Mailpit
        run: docker run -d --name mailpit -p 1025:1025 -p 8025:8025 axllent/mailpit

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The two dark-launch flags MUST be set here, not on the preview server. Vite inlines
      # `import.meta.env` at BUILD time (`frontend/src/config/env.ts` parses it), so the
      # `webServer.env` block in `e2e/playwright.config.ts` only takes effect locally, where the
      # command is `dev` and env is read per request. In CI the command is `preview`, which serves
      # an already-built bundle — and the visual job reuses servers this workflow starts, so
      # `webServer` never runs at all. Without these, `VITE_ENABLE_*` fall back to their `'false'`
      # defaults and every collaboration/monetization spec silently tests the flag-off surface:
      # the routes are unregistered, `settings-layout` drops its Safety and Billing sections, and
      # the @visual specs fail before `toHaveScreenshot` so their baselines can never be minted.
      #
      # `VITE_API_URL` is REQUIRED and has no default in `frontend/src/config/env.ts`, and
      # `frontend/.env` is gitignored — so it does not exist on a runner. Without this line the
      # frontend bundle throws at MODULE LOAD ("Invalid environment configuration: VITE_API_URL:
      # Required"), `#root` never mounts, and the app serves a blank page that still answers 200
      # — so `wait-health.sh` passes and the failure only surfaces as `setup-frontend` timing out
      # on `getByLabel('Email')`, taking all 48 frontend specs with it as skips.
      #
      # Admin does NOT need it here only because `admin/src/config/env.ts` defaults the same
      # value. Set it explicitly for both anyway: the default silently masking a missing var is
      # what made this a one-app outage instead of an obvious two-app one.
      - name: Build shared packages + both apps
        env:
          VITE_API_URL: http://localhost:4000/api/v1
          VITE_ENABLE_COLLABORATION: 'true'
          VITE_ENABLE_MONETIZATION: 'true'
        run: |
          pnpm --filter "@qalam/*" build
          pnpm --filter frontend build
          pnpm --filter admin build

      # Migrate + seed BEFORE booting the app. SettingsService.onModuleInit calls
      # syncDefinitions() (settings + feature-flag definitions) against the DB at
      # bootstrap, so an unmigrated schema kills the process on start and the health
      # wait then burns its full timeout before failing the job.
      - name: Build backend, migrate, seed, start
        run: |
          pnpm --filter backend build
          pnpm --filter backend migration:run
          pnpm --filter backend seed
          pnpm --filter backend seed:e2e
          node backend/dist/main.js &
          e2e/scripts/wait-health.sh http://localhost:4000/health 120

      - name: Start app preview servers (host)
        run: |
          pnpm --filter frontend preview --port 5173 --strictPort &
          pnpm --filter admin preview --port 5174 --strictPort &
          e2e/scripts/wait-health.sh http://localhost:5173 120
          e2e/scripts/wait-health.sh http://localhost:5174 120

      - name: Pull pinned Playwright image
        run: docker pull "$PLAYWRIGHT_IMAGE"

      # Verify (default) or regenerate (workflow_dispatch input) the committed baselines. On
      # regeneration the updated PNGs are uploaded as an artifact for review + commit in the PR
      # ([10 §2.2] — baselines are reviewed, never blind-accepted).
      # `--retries=0` overrides the config's `retries: CI ? 2 : 0` for THIS job only, on the command
      # line rather than per-project: the eight projects below are the same ones the functional jobs
      # use, so a per-project `retries` would disarm their retries too.
      #
      # A pixel diff cannot pass on retry — the render is deterministic within a run, so a second
      # attempt re-measures the same difference. Retrying only tripled the cost, and it is most of
      # why this job took 17.6 min in run #24 (~73 failures × 3 attempts). It also made real
      # failures report as FLAKY, which reads as noise when it is nothing of the sort (48 §3.25e:
      # webkit's a11y failures hid in exactly that gap for two runs).
      - name: Run @visual in the pinned image
        run: |
          UPDATE=""
          if [ "${{ inputs.update_visual_baselines }}" = "true" ]; then UPDATE="--update-snapshots"; fi
          docker run --rm --network host --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -e CI=1 -e E2E_REUSE_SERVER=1 \
            -e E2E_API_URL=http://localhost:4000/api/v1 \
            -e E2E_BASE_URL_FRONTEND=http://localhost:5173 \
            -e E2E_BASE_URL_ADMIN=http://localhost:5174 \
            -v "$GITHUB_WORKSPACE":/work -w /work/e2e \
            "$PLAYWRIGHT_IMAGE" \
            npx playwright test --grep @visual \
              --project=frontend-chromium --project=frontend-firefox --project=frontend-webkit \
              --project=admin-chromium --project=admin-firefox --project=admin-webkit \
              --project=frontend-dark --project=admin-dark \
              $UPDATE --workers=2 --retries=0

      - name: Upload updated baselines (on regenerate)
        if: ${{ inputs.update_visual_baselines == true && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: updated-visual-baselines
          path: e2e/tests/**/*-snapshots/**/*.png
          retention-days: 14

      - name: Upload report + diffs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-visual
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
