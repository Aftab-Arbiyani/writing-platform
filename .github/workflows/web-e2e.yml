name: Web E2E

# Browser end-to-end suite (Playwright) for the frontend + admin apps against a
# real backend + Postgres/Redis/MinIO/Mailpit. Mirrors e2e.yml's infra wiring.
# Non-blocking for now (workflow_dispatch + merge to main); becomes a required PR
# gate at Phase 2 exit (docs/e2e/07 §6).
on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: web-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: qalam
          POSTGRES_PASSWORD: qalam
          POSTGRES_DB: qalam
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U qalam"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://qalam:qalam@localhost:5432/qalam
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-not-a-real-secret-000000
      JWT_REFRESH_SECRET: ci-refresh-secret-not-a-real-secret-00000
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: qalam-media
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      SMTP_URL: smtp://localhost:1025
      APP_URL: http://localhost:5173
      ADMIN_URL: http://localhost:5174
      # Scheduler off (cron would fire mid-suite); workers stay on.
      SCHEDULER_ENABLED: 'false'
      # Rate limiter off — the suite registers many throwaway users from one IP.
      RATE_LIMIT_ENABLED: 'false'
      CI: 'true'
      E2E_API_URL: http://localhost:4000/api/v1
      E2E_MAILPIT_URL: http://localhost:8025
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Start MinIO + create bucket
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/ready && break || sleep 2
          done
          aws --endpoint-url http://localhost:9000 s3 mb s3://qalam-media || true
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          AWS_DEFAULT_REGION: us-east-1

      - name: Start Mailpit
        run: docker run -d --name mailpit -p 1025:1025 -p 8025:8025 axllent/mailpit

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages + both apps
        run: |
          pnpm --filter "@qalam/*" build
          pnpm --filter frontend build
          pnpm --filter admin build

      - name: Build + start backend, migrate, seed
        run: |
          pnpm --filter backend build
          node backend/dist/main.js &
          e2e/scripts/wait-health.sh http://localhost:4000/health 120
          pnpm --filter backend migration:run
          pnpm --filter backend seed
          pnpm --filter backend seed:e2e

      - name: Install Playwright browser (${{ matrix.browser }})
        run: pnpm --filter e2e exec playwright install --with-deps ${{ matrix.browser }}

      - name: Run E2E (${{ matrix.browser }} shard ${{ matrix.shard }})
        run: >-
          pnpm --filter e2e exec playwright test
          --project=frontend-${{ matrix.browser }} --project=admin-${{ matrix.browser }}
          --shard=${{ matrix.shard }}/2

      - name: Upload report + traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}-shard${{ matrix.shard }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
