# ══════════════════════════════════════════════════════════════════════════
# Qalam — production compose (single-VM Phase 1 topology, docs 15 §3/§10).
#
# Runs the data stores + the backend (API + in-process BullMQ workers). Object
# storage (S3/R2) and SMTP are EXTERNAL managed services in production — wire
# them via the backend's env_file. The TLS edge (nginx + static frontends) is
# deployed separately (infrastructure/nginx, docs 15 §7).
#
# Deploy:
#   docker compose -f docker-compose.prod.yml --env-file .env.production pull   # or build
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#   docker compose -f docker-compose.prod.yml run --rm backend pnpm --filter backend migration:run
# ══════════════════════════════════════════════════════════════════════════
name: qalam-prod

# Bounded, rotated container logs — the host ships stdout (docs 14 §1.7).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qalam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-qalam}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-qalam}']
      interval: 10s
      timeout: 5s
      retries: 5
    stop_grace_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: '2', memory: 2g }
        reservations: { cpus: '0.5', memory: 512m }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory',
        '512mb',
        '--maxmemory-policy',
        'noeviction',
      ]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    stop_grace_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: '1', memory: 768m }
        reservations: { cpus: '0.25', memory: 128m }

  backend:
    # Prefer an IMMUTABLE, digest-or-sha tag so a redeploy can never drift:
    #   BACKEND_IMAGE=ghcr.io/qalam/qalam-backend:sha-1a2b3c4   (CI-published)
    # The build-identity metadata (version/sha/time) is baked into the image, so
    # pull-based deploys carry it without needing the build block below.
    image: ${BACKEND_IMAGE:-ghcr.io/qalam/qalam-backend:latest}
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
      # Build-time provenance — set by CI; harmless empties on a bare build.
      args:
        BUILD_VERSION: ${BUILD_VERSION:-}
        GIT_SHA: ${GIT_SHA:-}
        BUILD_TIME: ${BUILD_TIME:-}
        BUILD_NUMBER: ${BUILD_NUMBER:-}
        RELEASE_CHANNEL: ${RELEASE_CHANNEL:-production}
    restart: unless-stopped
    # All app secrets (JWT/S3/SMTP/SENTRY/…) come from the env file — nothing
    # secret is inlined here. Zod validates them at boot (fail-fast).
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 4000
      # Compose service DNS overrides any host values in the env file.
      DATABASE_URL: postgresql://${POSTGRES_USER:-qalam}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-qalam}
      REDIS_URL: redis://redis:6379
      # Hops of trusted proxy in front of the app (the TLS edge nginx = 1; add
      # one per extra LB/CDN). Must match X-Forwarded-For depth at the edge.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      # Per-deploy runtime identity (NOT baked — supplied at deploy time).
      DEPLOYED_AT: ${DEPLOYED_AT:-}
      INSTANCE_ID: ${INSTANCE_ID:-}
    ports:
      - '${BACKEND_PORT:-4000}:4000'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    # PID-1 signal forwarding → NestJS enableShutdownHooks drains HTTP + workers.
    init: true
    # Give the graceful-shutdown sequence room (docs 15 §6: drain ≤30s + close).
    stop_grace_period: 45s
    # Container healthcheck is defined in the Dockerfile (hits /health).
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: '2', memory: 1g }
        reservations: { cpus: '0.5', memory: 384m }

volumes:
  postgres-data:
  redis-data:
