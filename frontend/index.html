<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Qalam — a premium writing sanctuary for literary writers. Write, publish, and read in a calm, distraction-free space."
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FAF7F1" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#131110" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- PWA (Epic F10) — installable manifest + iOS home-screen icon. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg" />
    <meta name="apple-mobile-web-app-title" content="Qalam" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Default social meta (per-page <Seo> overrides these on public routes). -->
    <meta property="og:site_name" content="Qalam" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Qalam — a writing sanctuary" />
    <meta
      property="og:description"
      content="A premium writing sanctuary for Hindi and Urdu writers first, the world next."
    />
    <meta property="og:image" content="/og-image.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Qalam — a writing sanctuary" />
    <meta
      name="twitter:description"
      content="A premium writing sanctuary for Hindi and Urdu writers first, the world next."
    />
    <meta name="twitter:image" content="/og-image.svg" />

    <title>Qalam — a writing sanctuary</title>
    <script>
      // Runs BEFORE the app bundle: sets data-theme on <html> synchronously so the
      // first paint uses the right theme (no flash-of-wrong-theme). Mirrors the
      // resolution logic in src/stores/theme.store.ts — keep the two in sync.
      (function () {
        var mode = 'system';
        try {
          var raw = localStorage.getItem('qalam-theme');
          if (raw === 'light' || raw === 'dark' || raw === 'system') {
            mode = raw;
          } else if (raw) {
            // zustand/persist envelope: {"state":{"mode":"..."},"version":0}
            var parsed = JSON.parse(raw);
            if (parsed && parsed.state && parsed.state.mode) mode = parsed.state.mode;
          }
        } catch (_e) {
          /* storage unavailable or malformed — fall back to system */
        }
        var dark =
          mode === 'dark' ||
          (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
